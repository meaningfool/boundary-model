<script type="application/json" id="data">[{"id": "a", "name": "A · The Store, chosen", "md": "# Walkthrough example A: the Store\n\nAll paths below are in `/tmp/claude-0/-home-user/cdf782aa-10b7-528c-9e97-39ba0972e579/scratchpad/walkthrough/a-store/`.\n\n- `map.json` and `map.html`: the map of the Store today, with still images of every screen in `stills/`.\n- `steps/`: the Level 1 maps for steps 2 to 8, made from `map.json` by `steps/make-steps.mjs`, each drawn and shot. Run the script again whenever `map.json` changes.\n- `change/`: the map after the gift-card change, drawn against today's map with `render-map.mjs --against`, with its stills. It exists only to draw the change: a planned change does not belong in the map itself.\n\n## The system\n\nThe Store sells home goods online. Shoppers browse, order, cancel and follow their orders in a web shop and a mobile app, and the app can also show a product in the shopper's room through the phone's camera. Behind the scenes, a fraud check holds payments that look risky, and fraud analysts decide on each held order in an internal review console. Store managers keep the catalog right in a dashboard, and import whole catalog files with the `store` command. Inside, Storefront keeps the orders and the loyalty points, and calls on Catalog for products and stock, on Payments for the money, and on an outside shipping partner to send each order. Payments opens one level further, into Charge service and Fraud check, and Charge service asks the card network for the money.\n\nCounts: 3 consumers, 1 provider, 3 components at Level 2 and 2 at Level 3, 2 outside services, 7 resources, 9 boundaries, 23 capabilities. Two of the 23 repeat: the card network boundary exists for Payments and again for Charge service, as the map format requires.\n\n## Walkthrough\n\nThe renderer draws Level 1 and Level 2 on the same screen, so steps 2 to 8 use Level 1 maps with no components, cut from the full map. Each step lights only what it introduces.\n\n| Steps | Map | Screen |\n| --- | --- | --- |\n| 2 | `steps/step-02.json` | All providers |\n| 3 | `steps/step-03.json` | All providers |\n| 4 | `steps/step-03.json` | Store |\n| 5 to 8 | `steps/step-05.json` | Store |\n| 9 to 11 | `map.json` | Store, then Catalog and Shipping partner |\n| 12 | `map.json` | Payments, then Fraud check |\n\n### 1. What the Store is\n\n- On the map: nothing yet. A sketch of one box named Store is enough.\n- Introduces: the system the page follows.\n\nThe Store sells home goods online. Shoppers buy through a web shop and a mobile app. Behind the scenes, Store employees catch fraud and keep the catalog up to date, each with a tool of their own.\n\nWe will map it from the outside in. First we ask who uses the Store and for what. Only then do we open it and look at how it is built.\n\n### 2. The first consumer and the provider\n\n- On the map: step-02, All providers. The Shopper, the Store, and one line between them.\n- Introduces: consumer, provider, boundary, external boundary, Level 1.\n\nStart with the consumer everyone thinks of first: the Shopper. A consumer is a role, not a person. Anyone buying from the Store is a Shopper while they shop.\n\nThe provider is the Store: the thing the shopper believes they are using. The servers, apps and outside companies behind it stay hidden for now.\n\nThe line between them is a boundary. It is where the Store offers things to the Shopper. The Shopper is outside the system, so this boundary is external. External boundaries make up Level 1, the top of the map.\n\n### 3. A second consumer inside the company\n\n- On the map: step-03, All providers. The Fraud analyst joins the Shopper, with a second line into the same Store.\n- Introduces: a consumer has goals of its own; internal tools count; one boundary per consumer and provider; external means outside the system.\n\nThe Store holds orders that look risky. Fraud analysts, who work for the Store, decide on each held order in an internal review console. They want something no shopper ever asks for, so they are a second consumer, with a second boundary to the same Store.\n\nTheir boundary is external too. External means outside the system, not outside the company: analysts use the Store, they are not part of it. Their review console belongs on the map even though only staff ever see it, because they use it to get their work done.\n\n### 4. Two interfaces, one boundary\n\n- On the map: step-03, Store screen. The Shopper connects to the web shop and the mobile app. Both lead to Shop and See loyalty balance, and only the mobile app leads to See product in your room.\n- Introduces: interface; a boundary is not an interface; a capability that only one interface offers.\n\nThe Shopper reaches the Store through two interfaces: the web shop and the mobile app. An interface is the channel a consumer uses.\n\nThe two do not offer the same things. Only the app can show a sofa in your living room, at its real size, because it needs the phone's camera.\n\nIt is still one boundary: one consumer, one provider, however many interfaces. The boundary says what the Shopper can do. An interface only says where they do it.\n\n### 5. A third consumer, on the command line\n\n- On the map: step-05, Store screen. The Store manager connects to the dashboard and the store CLI, which both lead to Keep the catalog right. Select the store CLI: the panel lists List products and Import catalog. Select the dashboard: it lists List products, Edit product and Alert on low stock.\n- Introduces: a command line as an interface; a consumer's own scripts; what stays out.\n\nStore managers keep the catalog right. They edit products in a dashboard. When a supplier sends a new price list, they import the whole file with the `store` command.\n\nA store manager who runs that import every night from a script is still a store manager. The script is their own way of using the store CLI, not a new consumer.\n\nThe same `store` command can also migrate the Store's database. That works on the system, not with it, like the tools that build and deploy it, so it stays off the map.\n\n### 6. Capabilities\n\n- On the map: step-05, Store screen. Select Shop: the panel lists Browse products, Place order, List past orders and Cancel order. Select Place order: the panel shows what it takes and what it gives.\n- Introduces: capability, verb names, output, and what looks like a capability but is not.\n\nA capability is something a consumer can do with the provider to get a result. Its name starts with a verb, and it says what it takes and what it gives back. Place order takes a cart, a delivery address and a card. It gives the order, confirmed or on hold for review.\n\nSome things look like capabilities and are not. As an order goes through, the Store checks that each product is still in stock. That check is a step of Place order: its only result is whether the order goes ahead. Browse products shows the same stock, but shoppers come to it on its own, to find out, and often leave without buying. So Browse products is a capability, and the stock check is not.\n\nEntering a card, or trying another one after a decline, are steps of Place order too. And when the fraud check flags a payment, the Store does that on its own. No consumer asks for it, so it is not a capability either.\n\n### 7. Resources, and how capabilities act on them\n\n- On the map: step-05, Store screen. The Store keeps Product, Order, Loyalty balance and Fraud review. Select Product: Shop, See product in your room and Keep the catalog right light up, and the panel lists its properties and every capability that acts on it, with its mode. Then select Keep the catalog right to show Alert on low stock.\n- Introduces: resource, property, relationship, the four modes, representation.\n\nCapabilities work on resources: things with a state the consumer cares about. The Store's resources are Product, Order, Loyalty balance and Fraud review.\n\nEach capability says how it acts on them. Browse products observes products. Place order produces an order. Edit product mutates a product, and can set its low-stock threshold. Alert on low stock reacts: when a product's stock falls below that threshold, the store manager gets a notice.\n\nA product's price, stock and low-stock threshold are its properties: details that nobody finds or acts on alone. Resources also relate to each other. An order holds one or more products, and each fraud review is about one order.\n\nThe catalog file a store manager imports is a representation of products, one form they take. Nobody keeps that file once the import is done, so it is not a resource.\n\n### 8. Core and supporting areas\n\n- On the map: step-05, Store screen. The five area boxes, each marked core or supporting.\n- Introduces: area, core, supporting.\n\nCapabilities that serve one purpose form an area. Shoppers come to shop, so Shop is their core area. They could do without seeing a product in their room, or checking their points, so those are supporting areas.\n\nEach boundary has exactly one core area. Analysts come to review flagged orders and store managers to keep the catalog right, and neither has anything else.\n\n### 9. Inside the Store: components\n\n- On the map: `map.json`, Store screen. The Components column shows Storefront, Catalog and Payments, each with the resources it keeps. Select Shop: all three light up, because placing an order needs each of them.\n- Introduces: Level 2, component, what is not a component.\n\nNow open the Store. Level 2 shows the components it relies on to keep its promises. A component keeps state that only it changes, or makes decisions that only it makes.\n\nStorefront keeps the orders and the loyalty points, and decides how many points an order earns. Catalog keeps the products, with their prices and stock. Payments takes the money and gives it back, and decides which payments to hold.\n\nStorefront is not the web shop. The web shop and the mobile app only present what the components offer, so they are part of the interfaces. The gateway that passes the app's calls on, the search index that makes browsing fast, and the databases are not components either. They pass on or store what a component owns.\n\n### 10. Internal boundaries and their contracts\n\n- On the map: `map.json`, Store screen, the lines from Storefront to Catalog and Payments. Then open Catalog: Storefront uses it through the catalog API, for Get products for orders.\n- Introduces: internal boundary; a component as consumer; a contract as interface; a step for one consumer that is a capability for another.\n\nTo take an order, Storefront needs Catalog and Payments. That makes Storefront their consumer, so each pair has a boundary of its own. These are internal boundaries, inside the system. The interface of an internal boundary is a contract: here, the catalog API and the charges API.\n\nOpening Catalog shows what Storefront gets from it: Look up products, Reserve stock and Release stock. For the Shopper, reserving stock was only a step of Place order. For Storefront it is a capability, with a result of its own: the stock held, or the lines that ran out. Whether something is a capability depends on who the consumer is.\n\n### 11. Outside services, and answers that come back later\n\n- On the map: `map.json`, Store screen. Shipping partner is a dashed box after Storefront. Open it: Storefront uses Ship order through the shipping API.\n- Introduces: outside service; a boundary points one way; an answer that comes back belongs to the capability it completes.\n\nStorefront hands each confirmed order to the Shipping partner, an outside company with a warehouse. An outside service is not part of the Store, but the Store relies on it, so Storefront has a boundary with it like any other. Payments relies on another one, the card network, which shows up once Payments opens.\n\nSome answers come back later. The shipping partner sends delivery updates as the parcel moves. When the fraud check holds a payment, Payments tells Storefront the outcome once an analyst decides. These messages travel back, but each boundary still points one way, from the consumer who asked to the provider who delivers. Each message completes a capability Storefront asked for: Ship order, or Charge order.\n\n### 12. Zoom in once more: Level 3\n\n- On the map: `map.json`. Open Payments: Storefront reaches Charge orders through the charges API, and inside sit Charge service and Fraud check, with the card network as a dashed box. Then open Fraud check: Charge service uses Score payment through the fraud scoring API.\n- Introduces: Level 3; the same pattern one level down; one resource kept by two components; why Fraud check is not the analysts' provider.\n\nPayments opens into two components of its own. Charge service runs each charge and refund, and it alone changes a charge. Fraud check alone decides a payment's score, and keeps the analysts' reviews. Charge service is Fraud check's consumer, through the fraud scoring API. It is the same pattern as one level up: a consumer, a boundary, a provider.\n\nBoth components keep a Charge, each its own record. Charge service keeps the charge itself, and Fraud check keeps its own record of every charge it scored. One resource can live in two components, under one name.\n\nFraud check is also where the analysts' decisions land: the review console from step 3 leads here, two levels down. Fraud check is still not the analysts' provider. They use the Store's review console, which has no data of its own, so to them it is the Store.\n\n## Coverage\n\n| Concept | Where it appears | Fit |\n| --- | --- | --- |\n| Consumer | Shopper, Fraud analyst, Store manager | Natural |\n| Provider | Store | Natural |\n| Boundary | Nine in all, one per consumer and provider | Natural |\n| External boundary | The three Level 1 boundaries; step 3 adds \"outside the system, not outside the company\" | Natural |\n| Internal boundary | Storefront to Catalog and Payments; Charge service to Fraud check | Natural |\n| Interface | web shop, mobile app, review console, dashboard, store CLI; the contracts inside | Natural |\n| Two interfaces that differ | See product in your room, only in the mobile app, because it needs the camera; the store manager's dashboard and store CLI | Natural, and the drawing shows the Shopper's case |\n| A consumer's own scripts | A store manager's nightly import script, in step 5's text | Natural, text only |\n| Capability | 23, such as Place order, Decide fraud review, Import catalog | Natural |\n| Area, core and supporting | Shop core; See product in your room and See loyalty balance supporting | Natural, but only the Shopper has supporting areas |\n| Resource | Product, Order, Loyalty balance, Fraud review, Charge, Card authorization, Shipment | Natural |\n| Property | Product price, size, stock and low-stock threshold; order status and tracking number; review score and reasons | Natural |\n| Relationship | Resource descriptions: an order holds one or more products, each order has one charge, a fraud review is about one order | Natural, but the map format has no field for it and the drawing shows none; text only |\n| Mode | observes in Browse products, produces in Place order, mutates in Edit product, reacts in Alert on low stock | Natural; reacts appears once, on the store manager |\n| Output | Every capability's `gives`, such as the order confirmed or on hold | Natural |\n| Representation | The catalog file Import catalog takes; the product drawn in the room; the dashboard notice | Natural, but only in `takes` and `gives` text; nothing draws them |\n| Look-alike paired with a capability | The stock check inside Place order next to Browse products; in the change, the gift card check at checkout next to See gift card balance | Natural |\n| Other look-alikes | Entering a card, retrying a declined card, the fraud check flagging payments, points expiry; Reserve stock as a step for the shopper and a capability for Storefront | Natural |\n| Component | Storefront, Catalog, Payments; Charge service, Fraud check | Natural |\n| Not a component | Clients, the mobile gateway, the search index, the scoring model, the card network adapter, the money library, in `parts` | Natural, but `parts` are not drawn; text only |\n| Contract between components | catalog API, charges API, fraud scoring API | Natural |\n| Answers inside their boundary | A held charge's outcome on the charges API; the analyst's decision on the fraud scoring API; delivery updates on the shipping API | Natural |\n| A resource kept by two components | Charge, kept by Charge service and by Fraud check | A little forced; the page gives one sentence on why Fraud check keeps its own record |\n| Outside service | Shipping partner for Storefront; Card network for Payments and Charge service | Natural |\n| Level 3 | Payments opens into Charge service and Fraud check | Natural |\n| What stays out | `store migrate` and `store seed`, fraud model training, deploy, tests, flagging, points expiry, index rebuilds and health checks; sign-in left out by the corpus | Natural |\n| Implementation choice | The scoring model, the outcome queue, the databases | Natural |\n| NEW, MODIFIED, REMOVED | The change has NEW and MODIFIED at three levels, with a NEW component and a NEW internal boundary; REMOVED appears in one aside | NEW and MODIFIED natural; REMOVED shown in an aside |\n\n## The change\n\n### Page text\n\nA shopper should be able to pay with a gift card. Before anyone talks about tables or endpoints, `shape-boundaries` turns that request into boundary changes, marked against the map: NEW, MODIFIED or REMOVED.\n\nIt asks one question at a time, the one that could change the shape most, with a recommended answer. A question whose answer cannot add, remove or redefine a boundary change waits in Details, for refinement.\n\nChecking a gift card at checkout is a step of Place order: its only result is whether the gift card pays. Seeing a gift card's balance is a capability: people check a card before they shop, and some never do. So the shape adds See gift card balance, and no \"Check gift card\".\n\n### Questions asked while shaping\n\n- Where do gift cards come from? Impact: adds Issue gift cards for the Store manager, or Buy gift card for the Shopper, or an outside gift card service that keeps Gift card instead of the Store. Answer: store managers issue them in batches from the store CLI, for partner shops to sell. Selling them in the web shop is a later change.\n- Is a gift card a kind of loyalty balance? Impact: decides whether Storefront keeps Gift card beside the points, or Payments does. Answer: no. Points are a reward; a gift card holds money someone paid, and shoppers spend it like a card, so Payments keeps it. \"Voucher\", \"store credit\" and \"prepaid balance\" all mean Gift card here.\n- Does a canceled order paid by gift card give the money back? Impact: modifies Cancel order and Refund order, or leaves them alone and stops shoppers canceling such orders. Answer: yes, back on the same gift card.\n- Who inside Payments keeps gift cards? Impact: Charge service keeping them changes no boundary inside Payments; a component of their own adds a component and an internal boundary. Answer: a new Gift cards component. Issuing cards and keeping balances is not running a charge, and Charge service would otherwise serve the store manager.\n- Can store managers block a lost gift card? Impact: adds Block gift card. Answer: not in this change.\n\n### The shape\n\n```markdown\nResources of Store:\n\n- NEW **Gift card**: a code with money on it, which pays for orders until its balance runs out.\n\n**Shopper <-> Store**: MODIFIED, shoppers pay with a gift card, alone or with a card, get the money back on it when they cancel, and see what is left on it.\n\n- Interfaces: web shop · mobile app\n- Shop (core)\n  - MODIFIED Place order: produces **Order** · mutates **Loyalty balance** · mutates **Gift card**\n  - MODIFIED Cancel order: mutates **Order** · mutates **Loyalty balance** · mutates **Gift card**\n- See gift card balance (supporting)\n  - NEW See gift card balance: observes **Gift card**\n\n**Store manager <-> Store**: MODIFIED, store managers issue gift cards in batches for partner shops to sell.\n\n- Interfaces: dashboard · store CLI\n- Issue gift cards (supporting)\n  - NEW Issue gift cards: produces **Gift card** [store CLI]\n\nResources of Payments:\n\n- NEW **Gift card**: the same gift card, kept by a new component inside Payments.\n\n**Storefront <-> Payments**: MODIFIED, a charge or a refund can move money on a gift card.\n\n- Interfaces: charges API\n- Charge orders (core)\n  - MODIFIED Charge order: produces **Charge** · mutates **Gift card**\n  - MODIFIED Refund order: mutates **Charge** · mutates **Gift card**\n\nInside Payments: NEW component **Gift cards**: keeps gift cards and their balances; serves Storefront › Charge orders, Shopper › See gift card balance, Store manager › Issue gift cards.\n\nResources of Gift cards:\n\n- NEW **Gift card**: the gift card and its balance, which only Gift cards changes.\n\n**Charge service <-> Gift cards**: NEW, Charge service takes money off a gift card for a charge and puts it back for a refund.\n\n- Interfaces: NEW gift cards API\n- Charge gift cards (core)\n  - NEW Charge gift card: mutates **Gift card**\n  - NEW Refund gift card: mutates **Gift card**\n\n**Shape complete: YES**\n\n**Open**\n\n- None.\n\n**Details**\n\n- Can a gift card pay part of an order, with a card paying the rest? — About: Place order, Charge order\n- What does checkout show for an unknown or empty gift card? — About: Place order\n- Do gift cards expire? — About: Gift card\n- Do gift card payments earn loyalty points? — About: Place order\n- Does Fraud check score payments made by gift card? — About: Charge order\n- What does Issue gift cards write out? — About: Issue gift cards\n- When an order paid by both is canceled, what goes back where? — About: Cancel order, Refund order\n```\n\nThe dashes in Details and the \"Inside Payments\" line follow the skills' own formats. Three boundaries do not change, and the page can say why. The fraud analyst reviews a gift-card order like any other. Score payment stays as it is, since whether Fraud check scores gift-card payments is a detail. The card network never sees a gift card.\n\nIssue gift cards sits in a supporting area because store managers come to keep the catalog right, and issuing a batch of cards for partner shops is an occasional errand beside that.\n\nThe drawn comparison, `change/after-gift-cards.html`, marks Shop, Payments and Charge orders Changed, and See gift card balance, Issue gift cards, Gift cards and its boundary with Charge service New. Its Payments screen, `change/stills/2-store--payments.png`, is the best single image for this part of the page.\n\n### Aside: what REMOVED looks like\n\nGift cards take nothing away, but a change can. If the Store had dropped its points when gift cards arrived, the shape would also say:\n\n```markdown\nResources of Store:\n\n- REMOVED **Loyalty balance**: the points a shopper earned from orders.\n\n**Shopper <-> Store**: MODIFIED, shoppers no longer earn or see points.\n\n- Shop (core)\n  - MODIFIED Place order: produces **Order** · mutates **Gift card**\n- See loyalty balance (supporting)\n  - REMOVED See loyalty balance: observes **Loyalty balance**\n```\n\n### Slices\n\nOption A: by interface, web first. Recommended.\n\nTradeoff: shoppers can pay with gift cards after the first slice, and each later slice adds one thing they can see. The first slice is the heaviest, since it carries the new component, its boundary and issuing. Leaving refunds out of it would be worse: a shopper who canceled a gift-card order would get nothing back, an invalid intermediate state.\n\n1. Pay with a gift card on the web: a store manager issues gift cards, and a shopper pays with one in the web shop and gets the money back on it after canceling.\n   - Boundary changes: NEW Gift card; NEW Issue gift cards; NEW Gift cards and NEW Charge service <-> Gift cards, with Charge gift card and Refund gift card; MODIFIED Charge order and Refund order; MODIFIED Place order and Cancel order, split to the web shop\n2. See a gift card's balance: a shopper enters a code in the web shop or the app and sees what is left.\n   - Boundary changes: NEW See gift card balance\n3. Pay with a gift card in the app.\n   - Boundary changes: MODIFIED Place order and Cancel order, split to the mobile app\n\nOption B: issue first. Slice 1 lets a store manager issue gift cards, slice 2 lets shoppers pay and cancel on both interfaces, and slice 3 shows balances. Smells: a heavy second slice, and an invalid intermediate state after slice 1 if any issued card reaches a shopper, since nothing accepts it yet.\n\n### Refinement of slice 1\n\nExpected behavior:\n\n- Issuing gift cards with the store CLI, for a number of cards and an amount, writes a file with one line per new card: its code and its amount.\n- At checkout in the web shop, a shopper can enter a gift card code, and checkout shows how much the gift card will pay before the shopper confirms.\n- When a gift card holds at least the order total, it pays the whole order, and checkout asks for no card.\n- When a gift card holds less than the order total, it pays all it holds, and the shopper's card pays the rest.\n- When a gift card holds nothing, checkout says the gift card is empty and asks for another way to pay. The order is placed only once it is paid in full.\n- When checkout does not know a code, it says so.\n- When a shopper cancels an order paid by gift card, each part goes back where it came from, and the gift card holds what it held before the order.\n- An order earns loyalty points on its whole total, whether the shopper paid by card, gift card or both.\n- Fraud check scores gift-card payments like card payments. When an analyst cancels a flagged order paid by gift card, the gift card gets its money back.\n\nDesign decisions:\n\n- Gift cards live in a new Gift cards component inside Payments, which Charge service reaches through the gift cards API. Rejected: keeping them in Charge service, because issuing cards and keeping balances is not running a charge, and Charge service would then serve the store manager. Settled while shaping.\n- Charge service authorizes the card before it takes money off the gift card. Rejected: the gift card first, because a declined card would then need the gift card's money put back, and in between the shopper would see money gone for an order that failed.\n- Gift cards do not expire. Rejected: an expiry date on each card, because it adds a rule, a checkout message and a property shoppers must track, and nothing in this change needs it.\n- Points count on the whole order total. Rejected: points only on the part paid by card, because a gift card holds money someone already paid in a partner shop, and shoppers would earn different points for the same basket depending on how they paid.\n- Fraud check scores every charge, gift card or not. Rejected: skipping the score for gift-card payments, because stolen or guessed codes are a common way to commit fraud with gift cards.\n- Checkout refuses an empty gift card with a message. Rejected: quietly charging the whole order to the card, because the shopper would not know whether the gift card worked.\n- Gift cards keeps each balance as a list of adjustments, the way Storefront keeps points. Rejected: one balance number changed in place, because a refund, or a shopper asking where the money went, needs every payment and refund behind the balance. The adjustments are how the balance is kept, not a resource.\n\nSlices 2 and 3 raise no new questions: the decisions above settle them.\n\n- Slice 2: entering a gift card code in the web shop or the mobile app shows the money left on it; an unknown code shows that the Store does not know it.\n- Slice 3: in the mobile app, every expected behavior of slice 1 that concerns checkout and canceling holds as it does in the web shop.\n\n### Issues\n\nThree standalone issues, one per slice. Each carries everything it needs, so none needs a parent.\n\n```markdown\n# Pay with a gift card in the web shop\n\n## Parent\n\nNone\n\n## Summary\n\nShoppers pay for an order in the web shop with a gift card, alone or with a card, and get the money back on it when they cancel. Store managers issue gift cards with the store CLI, for partner shops to sell.\n\n## Type\n\nAFK\n\n## Before Starting\n\nConfirm that each item below is available and works before implementing. If one is not, stop and ask rather than implement work that cannot be proven.\n\n- Access to the card network's test environment, with a test card.\n\n## Expected Behavior\n\n- Issuing gift cards with the store CLI, for a number of cards and an amount, writes a file with one line per new card: its code and its amount.\n- Web shop checkout accepts a gift card code and shows how much the gift card pays before the shopper confirms.\n- A gift card that holds at least the order total pays the whole order, and checkout asks for no card.\n- A gift card that holds less pays all it holds, and the shopper's card pays the rest.\n- An empty gift card is refused with a message that it is empty, and the order is placed only once it is paid in full.\n- An unknown code is refused with a message that the Store does not know it.\n- Canceling an order paid by gift card puts each part back where it came from, and the gift card holds what it held before the order.\n- An order earns loyalty points on its whole total, however it was paid.\n- Fraud check scores gift-card payments like card payments; canceling a flagged gift-card order puts the money back on the gift card.\n\n## Context and Decisions\n\n- A new Gift cards component inside Payments keeps gift cards and their balances, and alone changes them. Charge service reaches it through a new gift cards API, with two operations: charge a gift card, and refund a gift card. Rejected: keeping gift cards in Charge service, because issuing and balances are not running a charge.\n- The charges API's Charge order and Refund order now move money on gift cards; Storefront passes a gift card code with the card or instead of it.\n- Charge service authorizes the card before it takes money off the gift card. Rejected: gift card first, which would need money put back after a decline.\n- Gift cards do not expire. Rejected: an expiry date, which nothing in this change needs.\n- Points count on the whole total. Rejected: points on the card part only, since a gift card holds money already paid in a partner shop.\n- Fraud check scores every charge. Rejected: skipping gift-card payments, since stolen or guessed codes are a common fraud.\n- Each balance is kept as a list of adjustments. Rejected: one number changed in place, which loses the history a refund or a question needs.\n- Out of scope: the balance page, paying in the mobile app, selling gift cards in the web shop, and blocking a lost gift card.\n\n## Proof of Done\n\nIn a local Store connected to the card network's test environment, issue one gift card of 30 with the store CLI. In the web shop, place an order of 50 with that gift card and the test card: checkout shows the gift card pays 30, the order is confirmed, and the test card is charged 20. Start another order with the same code: checkout says the gift card is empty. Cancel the first order, then start another order with the same code: checkout shows the gift card pays 30 again.\n\n## Blocked by\n\nNone\n```\n\n```markdown\n# See a gift card's balance\n\n## Parent\n\nNone\n\n## Summary\n\nShoppers enter a gift card code in the web shop or the mobile app and see how much money is left on it.\n\n## Type\n\nAFK\n\n## Before Starting\n\nConfirm that each item below is available and works before implementing. If one is not, stop and ask rather than implement work that cannot be proven.\n\n- The mobile app running in a phone emulator that the agent can drive.\n\n## Expected Behavior\n\n- Entering a gift card code in the web shop shows the money left on it.\n- Entering a gift card code in the mobile app shows the money left on it.\n- An unknown code shows that the Store does not know it.\n\n## Context and Decisions\n\n- Gift cards keeps the balances, inside Payments; this issue adds the shoppers' way to read them, in both interfaces.\n- Gift cards do not expire, so the balance is the only thing shown.\n- Shoppers check a card before they shop, so this is a capability of its own, not part of checkout.\n\n## Proof of Done\n\nIssue a gift card of 30 with the store CLI, and pay 12 of an order with it in the web shop. Enter its code in the web shop and in the mobile app: both show 18 left. Enter a code that was never issued: both say the Store does not know it.\n\n## Blocked by\n\nPay with a gift card in the web shop\n```\n\n```markdown\n# Pay with a gift card in the mobile app\n\n## Parent\n\nNone\n\n## Summary\n\nShoppers pay for an order in the mobile app with a gift card, alone or with a card, and get the money back on it when they cancel, as they already can in the web shop.\n\n## Type\n\nAFK\n\n## Before Starting\n\nConfirm that each item below is available and works before implementing. If one is not, stop and ask rather than implement work that cannot be proven.\n\n- The mobile app running in a phone emulator that the agent can drive.\n- Access to the card network's test environment, with a test card.\n\n## Expected Behavior\n\n- Mobile app checkout accepts a gift card code and shows how much the gift card pays before the shopper confirms.\n- A gift card that holds at least the order total pays the whole order, and checkout asks for no card.\n- A gift card that holds less pays all it holds, and the shopper's card pays the rest.\n- An empty gift card is refused with a message that it is empty, and an unknown code with a message that the Store does not know it.\n- Canceling an order paid by gift card in the app puts each part back where it came from.\n\n## Context and Decisions\n\n- The charges API, Gift cards and the gift cards API already handle gift cards; this issue adds them to the mobile app's checkout and cancel.\n- The decisions of the web shop issue hold unchanged: the card is authorized before the gift card is charged, gift cards do not expire, points count on the whole total, and Fraud check scores every charge.\n\n## Proof of Done\n\nIn the emulator, issue a gift card of 100 with the store CLI. Place an order of 40 with it in the mobile app: checkout asks for no card, and the order is confirmed. The balance page shows 60. Cancel the order: the balance page shows 100.\n\n## Blocked by\n\nPay with a gift card in the web shop; See a gift card's balance\n```\n\n## Weak spots\n\n- The drawing does not follow the outside-in order by itself. The step maps fix that, but they are extra files: `steps/make-steps.mjs` must run again after every change to `map.json`.\n- Card network does not appear on the Store screen. The renderer hides Payments' Level 2 boundary with it because Charge service's Level 3 boundary refines it. Step 11's text says the card network shows up once Payments opens. This looks like a gap worth filing against `visualize-boundaries`: the map holds a Level 2 boundary that no Level 2 screen draws.\n- The analysts' link to Fraud check is not drawn. Fraud check's screen shows only Charge service as its consumer, so step 12's last paragraph has to carry it.\n- The full map's top screen lists Charge among the Store's resources, because the renderer counts what components keep inside it. The step maps avoid it, since they have no components.\n- The store manager's interface split shows only in the panel, since all four capabilities share one area box. Step 4 carries the lesson; step 5 only repeats it.\n- Level 2 now has three components, below the brief's four. They still teach everything the page needs: a consumer with two internal providers, one component that opens and one that does not, and an outside service at each level.\n- See product in your room could be read as another view of Browse products. The map records in `questions` why it is a capability of its own: a different goal, and the camera as an input.\n- Issue gift cards in a supporting area is still a little forced. The change states why in one sentence.\n- Only the store manager shows reacts. Step 7 selects Alert on low stock on purpose.\n- Relationships, representations and `parts` live in the map's text, not in the drawing. Steps 7 and 9 say them in words.\n- Storefront sounds like the web shop. Step 9 turns that into a point: the web shop is an interface, and Storefront keeps the orders.\n- Browse products returns a collection, which the model's naming rule would call List products. The model's own Store uses Browse products, so the map keeps it.\n- Shipping partner adds a box, a boundary and a resource. It gives orders somewhere to go and gives Cancel order a natural limit, \"an order that has not shipped yet\".\n- Sign-in, accounts and saved cards are left out by the corpus. List past orders and See loyalty balance take \"the shopper's account\", so a careful reader will notice.\n- Pages 01 and 02 will need to follow this Store. Catalog keeps products, the card network also takes refunds, the loyalty balance is on both interfaces, and the change has more items than page 01's four.\n", "map": "maps/a-store.html", "score": "Revised after the review"}, {"id": "b", "name": "B · Helpdesk", "md": "# Helpdesk: an invented example for the walkthrough\n\n## The system\n\nHelpdesk is the customer support of an invented company that makes coffee machines. An assistant answers customers' questions from the company's help articles, in a chat widget on the website and in the company's mobile app. When the articles do not cover a question, or the customer asks for a person, the conversation becomes a ticket for a support specialist, who works in an internal review console and also checks what the assistant said and why. Knowledge admins write the help articles as Markdown in a docs folder and bring Helpdesk in step with `helpdesk kb sync ./docs`. Inside, four components share the work: Conversations, the Assistant, the Knowledge base and Tickets. The Assistant relies on an outside Language model service, Conversations on the phones' Push service, and the Knowledge base opens into a Library and Search. The map has 3 consumers, 1 provider, 6 components, 2 outside services, 6 resources, 9 boundaries and 21 capabilities.\n\nWe kept the working name Helpdesk. Like Store, it is a plain noun that says what the system is, so the reader learns nothing extra. We renamed the second consumer from support agent to Support specialist, because the site is about coding agents, and AI products often call the assistant itself an agent.\n\n## Walkthrough\n\nEach step names the screen of `map.html` it uses and the boxes to select there. Selecting a box lights what it connects to.\n\n### 1. The system\n\n- **Map:** All providers. Helpdesk with its four resources: Conversation, Answer, Ticket, Article.\n- **Introduces:** the system, and the idea that we describe it from the outside in.\n- **Draft:** \"Helpdesk is the support of a company that makes coffee machines. An assistant answers customers' questions from the company's help articles, and hands the cases it cannot answer to people.\"\n\n### 2. The customer and Helpdesk\n\n- **Map:** All providers, Customer selected: one line to Helpdesk.\n- **Introduces:** consumer, provider, boundary, external boundary.\n- **Draft:** \"The customer asks how to descale their machine and gets an answer. They believe they are using the company's help, not a model or a search index, so the provider is Helpdesk, and the line between them is the first boundary. It is external: the customer is outside the system.\"\n\n### 3. The support specialist\n\n- **Map:** All providers, Support specialist selected.\n- **Introduces:** a second consumer with goals of its own, a second boundary, and what external means.\n- **Draft:** \"Support specialists answer the cases the assistant hands over, and check what it said. They work for the company, but they use Helpdesk from outside it, for goals of their own, so they have a boundary of their own: external means outside the system, not outside the company.\"\n\n### 4. Interfaces: one boundary, two channels\n\n- **Map:** Helpdesk, Customer selected: lines to the chat widget and the mobile app, then on to Get help and Follow up. The panel lists Get notified of a reply, marked mobile app.\n- **Introduces:** interface, a boundary that is not an interface, two interfaces that offer different things.\n- **Draft:** \"The customer reaches Helpdesk through the chat widget on the website and the help screens of the mobile app. Both let them ask, rate an answer and ask for a person, but only the app can tell them a person has replied. Two interfaces, one boundary: the consumer, the provider and the goals stay the same.\"\n\n### 5. The knowledge admin and a command line\n\n- **Map:** Helpdesk, Knowledge admin selected: kb CLI, then Keep articles current.\n- **Introduces:** a CLI as an interface, and a consumer's own scripts as the same consumer.\n- **Draft:** \"Knowledge admins write the articles in a docs folder and run `helpdesk kb sync ./docs`. The command line is their interface. The nightly script that runs the same command is still the knowledge admin, not a fourth consumer.\"\n\n### 6. Capabilities: what each consumer can do\n\n- **Map:** Helpdesk, Get help selected. The panel lists Ask a question, Rate an answer and Ask for a person, each with what it takes and gives.\n- **Introduces:** capability, output, resource, mode, representation.\n- **Draft:** \"A capability is something the consumer does to get a result, named with a verb. Ask a question takes a question and gives an answer with links to the articles it drew on: it changes the Conversation, produces an Answer and reads Articles. The links are a representation of the articles, and Ask for a person gives a ticket number at once and a specialist's reply later.\"\n\n### 7. Resources seen from two sides\n\n- **Map:** Helpdesk, the Answer resource selected: it lights Get help, Improve answers and Keep articles current. The panel lists Answer's properties.\n- **Introduces:** resource, property, relationship, a consumer that sees a resource differently.\n- **Draft:** \"Answer is one resource, seen in three ways. The customer reads and rates it, the knowledge admin lists the ones specialists flagged, and the specialist also reads its trace: the passages found, what the model was sent, and why the assistant offered a person or not. The trace is a property of the answer, not a resource of its own, and each answer belongs to one conversation and draws on one or more articles.\"\n\n### 8. Areas: core and supporting\n\n- **Map:** Helpdesk, the five area boxes, with core or supporting in each corner.\n- **Introduces:** area, core and supporting.\n- **Draft:** \"Capabilities group into areas named for what the consumer comes to do. Customers come to Get help; Follow up is supporting, because they would skip it if the first answer were enough. Specialists come to Solve tickets; Improve answers is supporting, because they would skip it if the assistant never erred.\"\n\n### 9. What is not a capability, and what stays out\n\n- **Map:** Helpdesk, nothing selected. The text names what the map leaves out.\n- **Introduces:** look-alikes of capabilities, what stays out.\n- **Draft:** \"When the articles do not cover a question, the assistant offers a person on its own: that is Helpdesk acting, and the customer's capability is Ask for a person. `helpdesk kb sync --dry-run` is a step of Sync articles. The evaluation suite engineers run before a release checks the system rather than using it, so it stays out, while the traces specialists read in the console stay in.\"\n\n### 10. Inside Helpdesk: components\n\n- **Map:** Helpdesk, the Components column: Conversations, Tickets, Assistant, Knowledge base.\n- **Introduces:** component, and what is not one.\n- **Draft:** \"Open Helpdesk and four components appear, each keeping state only it changes or making decisions only it makes. Conversations keeps each conversation, the Assistant decides what to say and keeps every answer with its trace, the Knowledge base decides which passages fit a question, and Tickets decides which specialist gets each ticket. The review console app, the model client and the vector database are not components: they present, reach or store.\"\n\n### 11. Boundaries between components, and outside services\n\n- **Map:** the Assistant screen: Conversations uses it through the answer API, and it uses the Knowledge base and the Language model service. Then the Tickets screen: Conversations, the tickets API, Hand over a conversation.\n- **Introduces:** internal boundary, contract between components, a component that is both consumer and provider, outside service, implementation choice.\n- **Draft:** \"Conversations is the Assistant's consumer: through the answer API, it asks for an answer to each new question. The Assistant is in turn a consumer of the Knowledge base and of an outside Language model service; which vendor runs the model is an implementation choice, so switching changes the model client, not the map. When Tickets posts a specialist's reply back into a conversation, that is not a second boundary: it completes Hand over a conversation.\"\n\n### 12. Level 3: inside the Knowledge base\n\n- **Map:** the Knowledge base screen: Library and Search, both keeping Article. Then the Search screen: Library, the index API, Update the index.\n- **Introduces:** Level 3, a resource kept by two components, a capability that only shows one level down.\n- **Draft:** \"Open the Knowledge base and the same pattern repeats. The Library keeps the articles as synced; Search keeps its own copy, cut into passages, and decides which passages fit a question, so both keep Article, each with its own state. After each sync, the Library asks Search to update the index: for the knowledge admin this happened on its own, but one level down it is a capability.\"\n\n## Coverage\n\n| Concept | Where it appears | Fit |\n| --- | --- | --- |\n| Consumer | Customer, Support specialist, Knowledge admin; inside, Conversations, the Assistant and the Library | Natural |\n| Provider | Helpdesk; inside, the Assistant, Tickets, the Knowledge base and Search | Natural |\n| Boundary | 9 boundaries, one per consumer and provider | Natural |\n| External and internal boundary | 3 external at Level 1; 6 internal, two of them with outside services | Natural. Specialists are inside the company but outside the system, which teaches what external means |\n| Interface | chat widget, mobile app, review console, kb CLI | Natural |\n| Two interfaces that differ | Get notified of a reply, offered only by the mobile app | Natural but thin: one capability differs, and it is a notification |\n| Capability | 14 at Level 1, 7 between components and services | Natural |\n| Area, core and supporting | Get help and Follow up; Solve tickets and Improve answers; Keep articles current | Natural for the customer. A little forced for the specialist, who has two real goals |\n| Resource | Conversation, Answer, Ticket, Article; Model response and Push message for the outside services | Natural |\n| Property | Answer's trace, rating and flag; Ticket's status; Article's last sync | Natural. The trace as a property is a strong example |\n| Relationship | A conversation holds many answers and at most one ticket; an answer draws on articles | Natural, but only in resource descriptions: the map has no field for it and the drawing does not show it |\n| Mode | observes List tickets, mutates Rate an answer, produces Ask for a person, reacts Get notified of a reply | Natural, except reacts, which appears once and could be read as the end of Ask for a person |\n| Output | Every capability's gives, such as a ticket number now and a reply later | Natural |\n| Representation | Links to articles in an answer, the trace view, the ticket number, the sync summary | Natural in text; the map has no field for it |\n| A look-alike that is not a capability | The assistant offering a person on its own, `kb sync --dry-run`, opening a ticket, copying a ticket number | Natural |\n| Component | Conversations, Assistant, Knowledge base, Tickets; Library and Search | Natural, but the split of Conversations and the Assistant needs a sentence |\n| Internal boundary | Conversations to Assistant, Conversations to Tickets, Assistant to Knowledge base, Library to Search | Natural |\n| Contract between components | answer API, tickets API, search API, index API | Natural |\n| A callback inside one boundary | Tickets posting replies back completes Hand over a conversation | Natural |\n| A resource kept by two components | Article, kept by the Library and by Search | Natural, and it mirrors the model's own Payments and Fraud check example. It appears only at Level 3 |\n| Outside service | Language model service, Push service | Natural |\n| Implementation choice | The model vendor, the vector database, the embedding library, all listed as parts | Natural |\n| Level 3 | Knowledge base opens into Library and Search | Natural, though engineers may first read it as a store and an index |\n| What stays out | Company account system, answer evaluations, logs and metrics, conversation clean-up, tests and deployment | Natural. Logs versus the traces specialists read is a good contrast |\n\n## The change\n\nThe request: let support specialists correct an AI answer so the assistant uses the correction next time.\n\n### Shaping questions, in the order asked\n\n1. Should a correction fix only the answer to the same question, or become knowledge the assistant can use for any question it fits? Impact: whether the Assistant or the Knowledge base keeps Correction, and whether Find passages and Update the index change. Answer: knowledge, kept by the Knowledge base, because customers ask the same thing in many words.\n2. Does a correction take effect at once, or after someone approves it? Impact: a NEW Approve a correction. Answer: at once, because specialists already reply to customers without approval.\n3. Does correcting replace flagging? Impact: REMOVED Flag an answer and List flagged answers. Answer: yes, because a correction says what a flag said, and how to fix it.\n4. What do knowledge admins do with corrections? Impact: NEW List corrections and Retire a correction. Answer: they list them, fold them into the articles, and retire them.\n5. Do customers see that an answer used a correction? Impact: MODIFIED Ask a question, or no change to the customer's boundary. Answer: no, because the answer still cites articles only.\n\n### The shape\n\nResources of Helpdesk:\n\n- NEW **Correction**: a support specialist's fix to one answer, which the assistant uses for every question it fits until a knowledge admin retires it.\n- MODIFIED **Answer**: loses its flag property.\n\n**Support specialist <-> Helpdesk**: MODIFIED, specialists correct wrong answers instead of flagging them.\n\n- Interfaces: review console\n- Improve answers (supporting)\n  - NEW Correct an answer: produces **Correction** · observes **Answer**\n  - MODIFIED Review answers: observes **Answer** · observes **Conversation** · observes **Correction**\n  - REMOVED Flag an answer: mutates **Answer**\n\n**Knowledge admin <-> Helpdesk**: MODIFIED, knowledge admins work through corrections instead of flagged answers.\n\n- Interfaces: kb CLI\n- Keep articles current (core)\n  - NEW List corrections: observes **Correction**\n  - NEW Retire a correction: mutates **Correction**\n  - MODIFIED Try a question: observes **Article** · observes **Correction**\n  - REMOVED List flagged answers: observes **Answer**\n\nInside Helpdesk, Level 2. Resources of Knowledge base:\n\n- NEW **Correction**: kept beside the articles, so Search can find it.\n\n**Assistant <-> Knowledge base**: MODIFIED, finding passages also finds the corrections that fit a question.\n\n- Interfaces: search API\n- Find passages (core)\n  - MODIFIED Find passages: observes **Article** · observes **Correction**\n\nInside Knowledge base, Level 3. Resources of Library and of Search:\n\n- NEW **Correction**: the Library keeps each correction; Search keeps its own indexed copy.\n\n**Library <-> Search**: MODIFIED, the Library sends corrections to be indexed with the articles.\n\n- Interfaces: index API\n- Update the index (core)\n  - MODIFIED Update the index: mutates **Article** · mutates **Correction**\n\n**Shape complete: YES**\n\n**Open**\n\n- None.\n\n**Details**\n\n- What does a correction hold besides the corrected text: a note, the question it answers? About: NEW Correction\n- How does a correction match a question asked in other words, and rank against article passages? About: MODIFIED Find passages\n- Does correcting an answer change what the customer already saw? About: NEW Correct an answer\n- How does `helpdesk kb ask` show a passage that comes from a correction? About: MODIFIED Try a question\n- Does a retired correction stay visible in Review answers? About: NEW Retire a correction\n- What happens to answers flagged before flagging goes? About: REMOVED Flag an answer\n\nThe customer's boundary does not change. Customers get better answers, but they never see a correction, so nothing they can see or do is different. This is worth a sentence on the page.\n\nA test of the shape: applied to a copy of the map, it passes the checker and draws with `render-map.mjs --against`. The customer side fades, and the change shows on both staff boundaries, on the Knowledge base and on the line from the Assistant to it.\n\n### Slices\n\n**Option A: correct first, retire flags last.** Tradeoff: a specialist sees the first correction used at the end of slice 1, and flagging keeps working until knowledge admins can see corrections, so no report goes missing. The cost is a short time with two ways to report a wrong answer.\n\n1. Correct an answer and see the assistant use it: a specialist corrects an answer, and the next customer who asks the same thing gets the corrected answer. Boundary changes: NEW Correction (Helpdesk, Knowledge base, Library, Search), NEW Correct an answer, MODIFIED Review answers, MODIFIED Find passages, MODIFIED Update the index.\n2. Work through corrections: a knowledge admin lists corrections, sees them used in `helpdesk kb ask`, and retires one once the article covers it. Boundary changes: NEW List corrections, NEW Retire a correction, MODIFIED Try a question.\n3. Retire flags: the flag button and `helpdesk kb flagged` are gone. Boundary changes: REMOVED Flag an answer, REMOVED List flagged answers, MODIFIED Answer.\n\nSmells: a heavy first slice, since slice 1 crosses three levels, though each part is needed for the first result anyone can see. Duplicate authority during slices 1 and 2, with flags and corrections both reporting wrong answers; slice 3 ends it.\n\n**Option B: inside out, with an enabling slice.** Tradeoff: the Knowledge base work is proven before anyone depends on it, but nobody can see the first slice, and the two staff boundaries change in separate slices.\n\n1. The Knowledge base keeps and finds corrections: a test stores a correction and gets it back from Find passages. Boundary changes: NEW Correction (Knowledge base, Library, Search), MODIFIED Find passages, MODIFIED Update the index.\n2. Specialists correct instead of flagging. Boundary changes: NEW Correction (Helpdesk), NEW Correct an answer, MODIFIED Review answers, REMOVED Flag an answer.\n3. Knowledge admins work through corrections. Boundary changes: NEW List corrections, NEW Retire a correction, MODIFIED Try a question, REMOVED List flagged answers.\n\nSmells: an enabling slice with no immediate consumer. An invalid intermediate state after slice 2: flagging is gone, but knowledge admins cannot see corrections until slice 3.\n\nRecommendation: Option A. Its last slice is the contract step of a parallel change: corrections arrive beside flags, people move over, then flags go.\n\n### Details settled in refinement\n\n1. **Questions asked in other words** (slice 1). Expected behavior: after a specialist corrects the answer to \"How often should I descale?\", a customer who asks \"how often does my machine need descaling\" gets an answer that follows the correction. Design decision: Search indexes each correction as one passage, made of the question it answers and the corrected text, and Find passages puts a correction ahead of article passages when both fit. Rejected: matching only the exact question, which misses most rephrasings.\n2. **Past conversations stay as they were** (slice 1). Expected behavior: correcting an answer changes nothing the customer already saw, and Review answers shows the original answer with its correction beside it. Design decision: a correction points to the answer it corrects, and the answer is never edited.\n3. **Corrections in a trial question** (slice 2). Expected behavior: `helpdesk kb ask` marks each passage that comes from a correction and names the specialist who wrote it.\n\n### Issues\n\n- Correct an answer in the review console. Proof of done: correct an answer, ask the same question in other words in the app, and get the corrected answer.\n- Work through corrections with `helpdesk kb`. Proof of done: list corrections, retire one, and see `helpdesk kb ask` stop using it.\n- Remove answer flags. Proof of done: the flag button and `helpdesk kb flagged` are gone, and corrections still work.\n\n## Weak spots\n\n- **The assistant looks like an actor.** Readers may make the assistant a consumer of the knowledge base, or a provider to the customer. The page needs one sentence: customers believe they use the company's help, so the assistant stays inside Helpdesk and is a component only from Level 2.\n- **The interfaces differ by one notification.** Only Get notified of a reply separates the widget from the app, and the map's questions record that it could be read as the end of Ask for a person. A starker difference, such as an anonymous website widget with history only in the app, would bring email in as a third customer interface and a third outside service.\n- **The specialist has two goals.** The rule of one core area puts Improve answers in a supporting area, which undersells the trace review the example is meant to feature. The page should say why, or the owner may prefer to make review the core.\n- **Conversations and the Assistant as two components.** Readers who would draw one chatbot box will ask why there are two. The answer, different state and different decisions, and Tickets reaching conversations without the Assistant, needs a sentence on the page.\n- **Level 3 can look like storage.** Engineers may read the Library and Search as a database and an index. The page has to stress that Search decides which passages fit and keeps state only it changes, while the vector database is a part.\n- **The Knowledge base screen hides the knowledge admin.** The drawing shows a box's own boundaries only, so the knowledge admin, who reaches the Knowledge base through Helpdesk's kb CLI, is not on that screen.\n- **Relationships and representations are not drawn.** The map format has no field for them, so the page states them in text.\n- **The Helpdesk screen is busy.** Three consumers, four interfaces, five areas, four components and two outside services sit on one screen. The steps need selections or cropped stills.\n- **The change hides from the customer.** The customer's boundary does not change, though customers are the ones who benefit. That is a good lesson, but readers will expect the opposite unless the page says it.\n- **The drawing reads a swap as a rename.** In the comparison, the page reports Correct an answer as \"was Flag an answer\", while the shape marks one REMOVED and one NEW. The text should follow the shape.\n- **Shaping skips the code.** `shape-boundaries` reads the code behind each boundary before shaping. With an invented system, the page has to say that this step was skipped.\n- **The name overlaps with real products.** Helpdesk is a common noun, and some products use it as a name. If the owner wants no overlap at all, a different plain name is needed.\n", "map": "maps/b-helpdesk.html", "score": "25 / 40"}, {"id": "c", "name": "C · Fernwire", "md": "# Fernwire: a walkthrough example\n\nExample C for page 05, A walkthrough. The map is `map.json`, drawn in `map.html`. It passes `check-map.mjs`: 3 consumers, 1 provider, 7 components, 2 outside services, 10 resources, 12 boundaries and 25 capabilities. Fernwire is an invented name; check it against trademarks before the page goes live.\n\n## The system\n\nFernwire is a money transfer app. A person opens an account in the phone app, asks what 200 euros will be worth in Philippine pesos, and sends it to their mother's bank account; they pay by bank transfer, and Fernwire pays out through its partner bank. Marketplaces use the same rails through an API to pay hundreds of sellers at once. Behind the scenes, a risk model scores every transfer for signs of money laundering, and when a score is high, a compliance analyst gets an alert. The analyst closes it as no concern, or opens a case on the account, investigates its history, and decides whether to report it to the authorities.\n\n## Walkthrough\n\nScreens are those of `map.html`: All providers, Fernwire, and the boxes that open from it. Steps 2 to 9 are about Level 1 only, but the Fernwire screen always shows the components too, so those steps need crops with the Components column faded, or the text notation.\n\n### 1. What Fernwire is\n\n- Map: no map yet. The step ends on the All providers screen with the Fernwire box alone.\n- Concept: the system, told as stories of the people who use it.\n- Draft: \"Fernwire moves money. People send it to family abroad, businesses pay their sellers with it, and a compliance team watches what moves through it for money laundering.\"\n\n### 2. The sender and Fernwire\n\n- Map: All providers, with Sender lit and joined to Fernwire. The other two consumers are faded.\n- Concept: consumer, provider, boundary, and the external boundary at Level 1.\n- Draft: \"The sender is the consumer everyone thinks of first. They believe they are using Fernwire, so Fernwire is the provider, and the line between them is the first boundary. It is external, because the sender is outside the system.\"\n\n### 3. A second consumer inside the company\n\n- Map: All providers, with Compliance analyst lit.\n- Concept: a consumer is a role with goals of its own, even when it works for the company. A second boundary, with the same provider.\n- Draft: \"Compliance analysts work for Fernwire, but they use it like any consumer: through the case console, to find money laundering. That goal is theirs, not the sender's, so they get a boundary of their own with the same provider.\"\n\n### 4. One boundary, two interfaces\n\n- Map: Fernwire screen, Sender selected. Lines run to the website and mobile app dots, then to Send money, Set rate alert and Open account. Open account is reached only from the mobile app dot.\n- Concept: interface; two interfaces that differ; a boundary is not an interface; the apps are clients, parts of their interfaces.\n- Draft: \"The sender reaches Fernwire through the mobile app and the website. Both sit on one boundary, because one consumer uses one provider through them. They do not offer the same things: you open an account only in the app, because it needs the phone's camera for your ID and a selfie.\"\n\n### 5. A third consumer, through an API\n\n- Map: Fernwire screen, Business customer selected: the payouts API dot and the Pay out area.\n- Concept: a separate consumer needs goals of its own; a business's own scripts are that consumer on another interface; a webhook back to the consumer stays inside its boundary.\n- Draft: \"A marketplace paying its sellers also sends money, but hundreds of payouts at a time, from its own systems, followed as batches. Those goals make it a third consumer. When Fernwire calls the business's server with a webhook as each payout lands, the call belongs to this boundary: it completes Send payout batch, and it does not make the business a provider.\"\n\n### 6. Capabilities and what they give back\n\n- Map: Fernwire screen, Send money area selected. The panel lists Get a quote, Send transfer and List transfers, each with what it takes and gives.\n- Concept: capability named with a verb; output; representation.\n- Draft: \"A capability is something the consumer can do to get a result. Get a quote takes an amount and two currencies and gives what the recipient would get, the fee and the rate. Send transfer gives the transfer, and later a push message when the money arrives; that message is one representation of the transfer's status, not a resource of its own.\"\n\n### 7. Resources, and how capabilities work on them\n\n- Map: Fernwire screen, resource chips. Clicking Account lights the areas whose capabilities work on it, and Accounts, which keeps it. The panel shows each resource's properties.\n- Concept: resource, property, relationship, and the four modes.\n- Draft: \"Capabilities work on resources the consumer cares about, and each says how. Get a quote observes the Exchange rate, Send transfer produces a Transfer and mutates the Account by using up part of its monthly limit, and Set rate alert produces a Rate alert and reacts when the Exchange rate reaches its target. A transfer's status and expected arrival are properties; a case holding several alerts on one account is a relationship.\"\n\n### 8. Core and supporting areas\n\n- Map: Fernwire screen, the five area boxes, labelled core or supporting.\n- Concept: area, core and supporting.\n- Draft: \"Areas group capabilities by purpose. Send money is the sender's core area, the reason they came. Opening an account is supporting: senders would skip it if they could, and Fernwire's rules do not let them.\"\n\n### 9. What is not a capability\n\n- Map: Fernwire screen, Investigate alerts selected. The point is what the panel does not list.\n- Concept: look-alikes that are steps, interactions, or what the provider does on its own; what stays out.\n- Draft: \"Checking the sending limit is part of Send transfer, because its answer only decides whether the transfer goes ahead. Getting a quote looks like the first step of sending, but many people check the rate and leave, so it is a capability. And no analyst raises alerts: the risk model does that on its own, and the analyst's capability is reading them, with List alerts.\"\n\n### 10. Inside Fernwire\n\n- Map: Fernwire screen, the Components column: Accounts, Transfers, Risk scoring and Case management, each with the resources it keeps.\n- Concept: Level 2; component; parts that are not components.\n- Draft: \"Open Fernwire and you find four components. Each keeps state only it changes or makes decisions only it makes: Accounts decides how much each account may send, Risk scoring decides each transfer's score. The mobile app, the website and the service that sends notifications are not components; they keep nothing and decide nothing.\"\n\n### 11. Components that use each other\n\n- Map: Fernwire screen, lines from Risk scoring to Transfers and Case management, and from Transfers to Accounts. Then the Accounts screen: Transfers uses it through the accounts API for Use sending limit, and it uses the Identity verification service.\n- Concept: internal boundary; contract between components; a component that is a consumer of another; a resource kept by two components; outside service.\n- Draft: \"Inside, the same pattern returns. Transfers is a consumer of Accounts, through the accounts API, when it counts a transfer against the sender's limit. Risk scoring is a consumer of Transfers and keeps its own record of every transfer it scored, so two components keep Transfer. Accounts is a consumer of an outside service, which checks IDs and calls back with the result.\"\n\n### 12. One level further: inside Transfers\n\n- Map: Transfers screen. Risk scoring uses it through transfer events; inside are Transfer tracker, Pricing and Bank payments; Bank payments and Pricing use the Partner bank, drawn as a dashed box; Transfers uses Accounts.\n- Concept: Level 3; the pattern repeats; an outside service reached by a component one level down.\n- Draft: \"Open Transfers and it has components of its own. The Transfer tracker moves each transfer through its statuses, Pricing decides rates, and Bank payments decides which incoming payment pays for which transfer. The partner bank, which Transfers relied on at Level 2, is now the outside service of two of them.\"\n\n## Coverage\n\n| Concept | Where it appears | Fit |\n| --- | --- | --- |\n| Consumer | Sender, Business customer, Compliance analyst | Natural |\n| Provider | Fernwire | Natural |\n| Boundary | Twelve, one for each consumer and provider pair | Natural |\n| External and internal boundary | Three Level 1 boundaries; nine below them, outside services included | Natural |\n| Interface | mobile app, website, payouts API, case console; contracts and outside APIs below | Natural |\n| Two interfaces that differ | Open account only in the mobile app, because it needs the camera | Natural |\n| Capability | 25 in all, 12 at Level 1 | Natural |\n| Area, core and supporting | Send money core; Set rate alert and Open account supporting. Transfers <-> Partner bank has Get market rate as supporting. The analyst and the business have a core area only | Natural |\n| Resource | Account, Transfer, Exchange rate, Rate alert, Payout batch, Alert, Case at Level 1 | Natural; Rate alert is thin |\n| Property | Transfer status and amounts, Account verification status and limit, Alert score and reason | Natural |\n| Relationship | An account makes many transfers; a batch holds many transfers; a case holds alerts on one account | Natural in the domain, but the map has no field for it, only descriptions |\n| Mode | All four at Level 1: Get a quote observes, Close case mutates, Open case produces, Set rate alert reacts. Watch transfers reacts at Level 2 | Natural; reacts at Level 1 rests on the rate alert, a real remittance feature |\n| Output | Every capability's gives; the webhook and the push message | Natural |\n| Representation | The push message on arrival, the quote screen, the webhook body | A little forced: only in gives text, never drawn |\n| Look-alike that is not a capability | Checking the limit, retaking a blurry selfie, adding a recipient while sending, raising alerts; Get a quote as the reverse case | Natural, and plentiful |\n| Component | Accounts, Transfers, Risk scoring, Case management | Natural |\n| Internal boundary between components | Transfers <-> Accounts, Risk scoring <-> Transfers, Risk scoring <-> Case management | Natural |\n| Contract between components | accounts API, transfer events, alerts API; pricing API and bank payments API at Level 3 | Natural |\n| Resource kept by two components | Transfer, by Transfers and by Risk scoring's own record; Bank payment, by Bank payments and by the Partner bank | Natural, and it mirrors the model's fraud-check example |\n| Outside service | Partner bank, Identity verification service, which calls back with its result | Natural; the Partner bank is hidden on the Fernwire screen |\n| Level 3 | Inside Transfers: Transfer tracker, Pricing, Bank payments | Natural, with the drawing caveat in Weak spots |\n| What stays out | Apps and the notification sender as parts; the event stream as an implementation choice; recipients as consumers; filing reports; model training; tests and deployment | Natural, except support, onboarding and sign-in, which are cut for size |\n\n## The change\n\nThe request: let analysts freeze an account while a case is open. Today an alert comes after the money has left, and the account can keep sending while the analyst investigates.\n\n### Questions asked while shaping\n\nEach question changed the shape, so it was asked; the highest-leverage one came first.\n\n1. Does a freeze also stop transfers already on their way? Impact: yes would add a held status to Transfer, a new boundary from Accounts or Case management to Transfers, and a change to List transfers for senders. Recommended and chosen: no, new transfers only; holding money already paid in is a change of its own.\n2. Does closing the case lift the freeze, or does the analyst lift it by hand? Impact: closing the case puts the freeze in Case management's hands, which adds the NEW Case management <-> Accounts boundary and changes Close case; lifting by hand adds an Unfreeze capability that the case console could call on Accounts directly. Recommended and chosen: closing the case lifts it.\n3. Does the freeze cover business accounts? Impact: yes changes the Business customer boundary too. Recommended and chosen: yes, the rule is about accounts, not people.\n4. Do analysts need a list of frozen accounts, with who froze each one and why? Impact: yes would make Freeze a NEW resource with a List frozen accounts capability; no makes it a status of Account. Recommended and chosen: no, the case already records who and why.\n\n### Shape\n\nThe em dashes in the Open and Details lines come from the `shape-boundaries` format.\n\n```markdown\nResources of Fernwire:\n\n- MODIFIED **Account**: a person's or business's account at Fernwire, now with a status, active or frozen, and the open cases that froze it\n- MODIFIED **Case**: an analyst's investigation of one account, now recording the freeze it placed\n\n**Compliance analyst <-> Fernwire**: MODIFIED, an analyst can freeze the account of an open case, and closing the case lifts the freeze\n\n- Interfaces: case console\n- Investigate alerts (core)\n  - NEW Freeze account: mutates **Account** · mutates **Case**\n  - MODIFIED Close case: mutates **Case** · mutates **Account**\n\n**Sender <-> Fernwire**: MODIFIED, a sender whose account is frozen cannot send money\n\n- Interfaces: mobile app · website\n- Send money (core)\n  - MODIFIED Send transfer: produces **Transfer** · mutates **Account**\n\n**Business customer <-> Fernwire**: MODIFIED, a business whose account is frozen cannot send payout batches\n\n- Interfaces: payouts API\n- Pay out (core)\n  - MODIFIED Send payout batch: produces **Payout batch** · produces **Transfer** · mutates **Account**\n\nResources of Accounts:\n\n- MODIFIED **Account**: gains a status, active or frozen, and the open cases that froze it\n\nResources of Case management:\n\n- MODIFIED **Case**: records the freeze it placed\n\n**Case management <-> Accounts**: NEW, Case management freezes the account of an open case and lifts the freeze when the case closes\n\n- Interfaces: accounts API\n- Change account status (core)\n  - NEW Change account status: mutates **Account**\n\n**Transfers <-> Accounts**: MODIFIED, Accounts refuses to count a transfer from a frozen account\n\n- Interfaces: accounts API\n- Use sending limit (core)\n  - MODIFIED Use sending limit: mutates **Account**\n\n**Shape complete: YES**\n\n**Open**\n\n- None\n\n**Details**\n\n- What does a sender see when they try to send from a frozen account? — About: Send transfer\n- What does the payouts API return to a frozen business? — About: Send payout batch\n- If two open cases freeze one account, when does the freeze lift? — About: Change account status, Close case\n- Must the analyst give a reason to freeze? — About: Freeze account\n```\n\nThe case management boundary reuses the accounts API, which Transfers already calls: one provider's interface, shared by two consumers for different capabilities.\n\n### Slices\n\nOption A, freeze first and lift later. Slice 1 lets analysts freeze; slice 2 makes closing a case lift the freeze. It has an invalid intermediate state: between the slices, a freeze outlives its case and someone must lift it by hand.\n\nOption B, senders first, then businesses. Chosen.\n\n1. Freeze and lift for senders: an analyst freezes a sender's account from an open case, the sender cannot send, and closing the case lets them send again. Boundary changes: MODIFIED Account and Case, NEW Freeze account, MODIFIED Close case, NEW Case management <-> Accounts, MODIFIED Use sending limit, MODIFIED Send transfer. Freeze account is split by consumer and refuses business accounts in this slice.\n2. Freeze businesses too: an analyst can freeze a business account, and its payout batches are refused. Boundary changes: the rest of Freeze account, MODIFIED Send payout batch.\n\nIts smell is a heavy first slice, acceptable for a change this small.\n\nOption C, an enabling slice first. Slice 1 teaches Accounts to hold a frozen account and refuse its transfers, with no visible change because nothing freezes one yet; slice 2 adds everything the analyst and the consumers see. Its smell is infrastructure with no immediate consumer, and slice 2 still carries all the behavior.\n\n### Details settled in refinement\n\n- What a frozen sender sees. Expected behavior: a sender whose account is frozen sees \"Your account is on hold. Contact us.\" when they try to send, in the app and on the website, and the message never mentions a case, an alert or compliance. Design decision: Fernwire shows the message it uses for any hold, so the sender is not tipped off that they are under investigation; a message naming the review was rejected.\n- Two cases on one account. Expected behavior: an account frozen by two open cases stays frozen until both cases close. Design decision: Accounts keeps the list of open cases holding each account and makes it active again when the list is empty; a single frozen flag, which the first case to close would clear, was rejected.\n- A frozen business. Expected behavior: a payout batch from a frozen business is refused at once with the error `account_on_hold`, and Fernwire makes no transfers. Design decision: the refusal comes back on the request, not as a webhook.\n\nEach slice then becomes one issue. Proof of done for the first: freeze an account from a case, see the sender's next transfer refused with the on-hold message, close the case, and see the sender send again.\n\n## Weak spots\n\n- The drawn page has no Level 1 view. The Fernwire screen shows consumers, capabilities and components at once, so steps 2 to 9 need crops or the text notation.\n- The Partner bank is missing from the Fernwire screen. Components inside Transfers call it, so the page draws that boundary only once Transfers opens. At Level 2 the reader sees one outside service, not two, and step 11 has to say the second one waits for step 12.\n- The Transfers screen shows Risk scoring as its only consumer. Senders, businesses and analysts reach Transfers through Fernwire's interfaces, and the screen does not repeat them. A reader will ask where the senders went. The text notation, with each component's serves line, answers it better than the drawing.\n- Watch transfers points against the flow of data: Risk scoring is the consumer, though the events go from Transfers to it. The model is right, but the page needs a sentence, and it is the second direction lesson after the webhook.\n- Bank capabilities appear twice. The three on Transfers <-> Partner bank come back at Level 3 on Bank payments and Pricing, because the format wants both levels. Six of the 25 capabilities are the bank's, and three of those are repeats. Readers may think Fernwire has two connections to the bank.\n- Use sending limit looks like a contradiction. Step 9 calls checki
