/* Layout: a list of projects on the left, one project's details on the right; a compare table as a second view. Same quiet monochrome as the site. */
:root {

}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.55; letter-spacing: -0.011em; -webkit-font-smoothing: antialiased; }
a { color: inherit; }

p { margin: 0; }
.mono { font-family: var(--mono); }
.klab { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg3); }

.wrap { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); padding: 28px 20px 24px; }

.views { display: inline-flex; gap: 2px; margin-top: 16px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; }

.group { margin-top: 22px; }

.item { display: grid; gap: 1px; padding: 7px 10px; border-left: 1px solid transparent; text-decoration: none; }

.item span { font-family: var(--mono); font-size: 11px; color: var(--fg4); }

.main { padding: 40px 56px 100px; min-width: 0; }

.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 760px; }

  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  .cons li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .top h2 { font-size: 28px; }

 "stars": "~47.4k (2026-11-26)", "lastCommit": "2026-11-24", "languages": ["Go (~49%)", "TypeScript (~45%)", "JavaScript"], "firstPartyLines": 688000, "linesNote": "About 688k first-party lines without tests (551k) and about 10k of vendored ONNX headers. kernel about 338k Go (kernel/model 147k, api 31k, apicontract 20k, av 17k, plugin 17k, sql 14k, mcp 14k, agent 8k); app about 339k TypeScript (protyle editor 142k). Corpus: the kernel without ocr, heif and preview helpers (about 320k), plus app/src/plugin (5k). The sync engine (dejavu) and the editor engine (lute) are separate repositories.", "size": "large", "consumers": [{"name": "Note-taker", "goal": "Writes block-based notes and databases on desktop, mobile or in a browser against a self-hosted server."}, {"name": "Plugin author", "goal": "Writes plugins, themes and templates and publishes them to the marketplace (bazaar)."}, {"name": "Agent or integrator", "goal": "Reads and changes a workspace through the kernel HTTP API, the CLI or the MCP server."}], "surfaces": ["desktop app", "mobile apps", "browser UI (Docker serve)", "kernel HTTP API", "siyuan CLI", "MCP server", "plugin API (petal)", "bazaar marketplace", "WebDAV"], "likelyComponents": [{"name": "Block tree and documents", "why": "Owns notebooks, documents and blocks on disk.", "paths": ["kernel/model", "kernel/treenode", "kernel/filesys"]}, {"name": "Index", "why": "Keeps the SQLite index for queries and search.", "paths": ["kernel/sql", "kernel/search"]}, {"name": "Attribute views (databases)", "why": "Owns database views over blocks.", "paths": ["kernel/av"]}, {"name": "Agent", "why": "The built-in AI agent and its memory.", "paths": ["kernel/agent"]}, {"name": "Marketplace", "why": "Installs and updates plugins, themes and templates.", "paths": ["kernel/bazaar", "kernel/plugin"]}], "outsideServices": ["SiYuan cloud (sync, membership)", "S3 and WebDAV storage", "AI model providers", "OIDC identity providers", "GitHub-hosted marketplace"], "secondLevel": "unsure", "secondLevelWhy": "kernel/model is one 147k-line package that touches every store, so the parts may form one component; sync lives in another repository.", "fit": "Agent-oriented and rich in surfaces, but too big, and its inner boundaries are less clear than Joplin's.", "risks": "Size; the kernel's monolithic model package; documentation partly in Chinese; AGPL.", "resolvedFrom": "Suggested by the user (SiYuan): github.com/siyuan-note/siyuan."}]</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const GROUPS = [["Mapped", ["Pi", "Executor", "T3 Code", "Rivet"]], ["Cloudflare ecosystem", ["Cloudflare OS", "EmDash", "workers-sdk (Wrangler, Miniflare, create-cloudflare)", "celld", "workerd", "Cloudflare Agents SDK"]], ["Other ecosystems", ["Astro and Starlight", "Zed", "Supabase", "Joplin", "SiYuan"]], ["Other candidates", ["fx", "OpenCode", "Cap"]], ["Less suited", ["Accountability", "Lalph", "PennyLane (Xanadu)"]], ["No public source", ["Rex (Superlogical)", "Pennylane (accounting company)"]]];
  const slug = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const byName = Object.fromEntries(DATA.map((p) => [p.name, p]));
  const ORDER = GROUPS.flatMap(([, names]) => names).filter((n) => byName[n]);
  DATA.forEach((p) => { if (!ORDER.includes(p.name)) ORDER.push(p.name); });
  const groupOf = (name) => (GROUPS.find(([, ns]) => ns.includes(name)) || ['Other'])[0];
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const kLines = (n) => (typeof n === 'number' ? (n >= 1000000 ? (n / 1000000).toFixed(2).replace(/0$/, '') + 'M' : Math.round(n / 1000) + 'k') : 'n/a');
  const levelWord = { mapped: 'Second level mapped', likely: 'Second level likely', unsure: 'Second level unsure', unlikely: 'Second level unlikely' };
  const levelPill = (v) => '<span class="pill' + (v === 'mapped' ? ' strong' : v === 'unlikely' ? ' dashed' : '') + '">' + esc(levelWord[v] || v) + '</span>';
  const hashes = ORDER.map((n) => slug(n));

  function sideNav(cur) {
    document.getElementById('groups').innerHTML = GROUPS.map(([g, names]) => {
      const items = names.filter((n) => byName[n]).map((n) => {
        const p = byName[n];
        const line = (p.firstPartyLines ? kLines(p.firstPartyLines) + ' lines · ' : '') + (p.secondLevel === 'mapped' ? 'mapped' : (p.repo ? 'level 2 ' + p.secondLevel : 'no source'));
        return '<a class="item" href="#' + slug(n) + '"' + (slug(n) === cur ? ' aria-current="page"' : '') + '><b>' + esc(n) + '</b><span>' + esc(line) + '</span></a>';
      }).join('');
      return '<div class="group"><span class="klab">' + esc(g) + '</span>' + items + '</div>';
    }).join('');
  }

  function detail(name) {
    const p = byName[name];
    const i = ORDER.indexOf(name), prev = ORDER[i - 1], next = ORDER[i + 1];
    const links = [p.repo && ['Repository', p.repo], p.url && p.url !== p.repo && ['Website', p.url]].filter(Boolean)
      .map(([k, u]) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(k) + ' ↗</a>').join('');
    const fact = (k, v) => '<div><span class="klab">' + k + '</span><p>' + (v ? esc(v) : '<span style="color:var(--fg4)">n/a</span>') + '</p></div>';
    const cons = (p.consumers || []).map((c) => '<li><b>' + esc(c.name) + '</b><span>' + esc(c.goal) + '</span></li>').join('');
    const comps = (p.likelyComponents || []).map((c) => '<li><b>' + esc(c.name) + '</b><p>' + esc(c.why) + '</p>' + ((c.paths || []).length ? '<code>' + c.paths.map(esc).join(' · ') + '</code>' : '') + '</li>').join('');
    const chips = (arr, cls) => (arr || []).length ? '<div class="chips' + (cls ? ' ' + cls : '') + '">' + arr.map((s) => '<span>' + esc(s) + '</span>').join('') + '</div>' : '<p style="color:var(--fg3)">None found.</p>';
    return '<article class="detail">'
      + '<div class="top"><h2>' + esc(p.name) + '</h2>' + levelPill(p.secondLevel) + '</div>'
      + '<p class="tagline">' + esc(p.tagline) + '</p>'
      + (links ? '<div class="links">' + links + '</div>' : '')
      + '<div class="facts">' + fact('Licence', p.license) + fact('Stars', p.stars) + fact('First-party lines', p.firstPartyLines ? kLines(p.firstPartyLines) + ' (' + (p.size || '') + ')' : null) + fact('Last commit', p.lastCommit) + '</div>'
      + (p.linesNote ? '<p class="note">' + esc(p.linesNote) + (p.languages && p.languages.length ? ' Languages: ' + esc(p.languages.join(', ')) + '.' : '') + '</p>' : '')
      + '<section class="sec"><h3>Who uses it</h3>' + (cons ? '<ul class="cons">' + cons + '</ul>' : '<p style="color:var(--fg3)">Not established.</p>') + '</section>'
      + '<section class="sec"><h3>Surfaces</h3>' + chips(p.surfaces) + '</section>'
      + '<section class="sec"><h3>' + (p.secondLevel === 'mapped' ? 'Components found by the extraction' : 'Likely components') + '</h3>' + (comps ? '<ul class="comps">' + comps + '</ul>' : '<p style="color:var(--fg3)">None identified.</p>') + '</section>'
      + '<section class="sec"><h3>Outside services</h3>' + chips(p.outsideServices, 'dashed') + '</section>'
      + '<section class="sec"><h3>Second level</h3><div class="verdict">' + levelPill(p.secondLevel) + '<p>' + esc(p.secondLevelWhy) + '</p></div></section>'
      + '<section class="sec prose"><h3>Fit</h3><p>' + esc(p.fit) + '</p>' + (p.risks ? '<p><b>Risks.</b> ' + esc(p.risks) + '</p>' : '') + '</section>'
      + '<section class="sec prose"><h3>How we found it</h3><p>' + esc(p.resolvedFrom) + '</p></section>'
      + '<nav class="pager">' + (prev ? '<a href="#' + slug(prev) + '"><span class="k">Previous</span><span class="t">' + esc(prev) + '</span></a>' : '')
      + (next ? '<a class="next" href="#' + slug(next) + '"><span class="k">Next</span><span class="t">' + esc(next) + '</span></a>' : '') + '</nav>'
      + '</article>';
  }

  function compare() {
    const rows = ORDER.map((n) => {
      const p = byName[n];
      return '<tr><td><a href="#' + slug(n) + '">' + esc(n) + '</a></td><td>' + esc(groupOf(n)) + '</td><td class="num">' + (p.firstPartyLines ? kLines(p.firstPartyLines) : 'n/a') + '</td><td>' + esc(p.license || 'n/a') + '</td><td class="num">' + esc((p.stars || 'n/a').replace(/\s*\(.*\)/, '')) + '</td><td class="num">' + (p.consumers || []).length + '</td><td class="num">' + (p.surfaces || []).length + '</td><td>' + esc(levelWord[p.secondLevel] ? levelWord[p.secondLevel].replace('Second level ', '') : p.secondLevel) + '</td></tr>';
    }).join('');
    return '<section class="compare"><h2>Compare</h2><p>All ' + ORDER.length + ' projects side by side. Line counts leave out tests, vendored and generated code.</p>'
      + '<div class="tablewrap"><table><thead><tr><th>Project</th><th>Group</th><th>Lines</th><th>Licence</th><th>Stars</th><th>Kinds of users</th><th>Surfaces</th><th>Second level</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  }

  function render() {
    const h = location.hash.slice(1);
    const isCompare = h === 'compare';
    const name = isCompare ? null : (ORDER[hashes.indexOf(h)] || ORDER[0]);
    document.getElementById('vProjects').toggleAttribute('aria-current', !isCompare);
    if (!isCompare) document.getElementById('vProjects').setAttribute('aria-current', 'page');
    document.getElementById('vCompare').toggleAttribute('aria-current', isCompare);
    if (isCompare) document.getElementById('vCompare').setAttribute('aria-current', 'page');
    document.getElementById('vProjects').href = '#' + slug(name || ORDER[0]);
    sideNav(name ? slug(name) : '');
    document.getElementById('main').innerHTML = isCompare ? compare() : detail(name);
    window.scrollTo(0, 0);
  }
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input, textarea, select, [contenteditable]')) return;
    const h = location.hash.slice(1);
    if (h === 'compare') return;
    const i = Math.max(0, hashes.indexOf(h));
    if (e.key === 'ArrowRight' && i < hashes.length - 1) location.hash = hashes[i + 1];
    if (e.key === 'ArrowLeft' && i > 0) location.hash = hashes[i - 1];
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script>
